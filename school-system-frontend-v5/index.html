<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School System</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">SS</div>
        <div>
          <div class="brand-title">School System</div>
          <div class="brand-subtitle">Administration Portal</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon">⌂</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="departments">
          <span class="nav-icon">▦</span><span>Departments</span>
        </button>
        <button class="nav-item" data-page="classrooms">
          <span class="nav-icon">▤</span><span>Classrooms</span>
        </button>
        <button class="nav-item" data-page="teachers">
          <span class="nav-icon">T</span><span>Teachers</span>
        </button>
        <button class="nav-item" data-page="students">
          <span class="nav-icon">S</span><span>Students</span>
        </button>
        <button class="nav-item" data-page="subjects">
          <span class="nav-icon">B</span><span>Subjects</span>
        </button>
        <button class="nav-item" data-page="enrollments">
          <span class="nav-icon">E</span><span>Enrollments</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="api-card">
          <span class="api-dot" id="apiDot"></span>
          <div>
            <strong id="apiStatus">Checking API...</strong>
            <small id="apiUrlText"></small>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-only" id="menuButton">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle">School overview and quick actions</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="date-chip" id="dateChip"></div>
          <button class="icon-button" id="refreshButton" title="Refresh">↻</button>
        </div>
      </header>

      <section class="content">
        <div id="pageRoot"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalSubtitle"></p>
        </div>
        <button class="icon-button" id="modalCloseButton">✕</button>
      </div>

      <form id="entityForm">
        <div class="form-grid" id="formFields"></div>
        <div class="modal-footer">
          <button class="btn secondary" type="button" id="modalCancelButton">Cancel</button>
          <button class="btn primary" type="submit" id="modalSaveButton">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer-backdrop hidden" id="drawerBackdrop">
    <aside class="drawer">
      <div class="drawer-header">
        <div>
          <h2 id="drawerTitle">Details</h2>
          <p id="drawerSubtitle"></p>
        </div>
        <button class="icon-button" id="drawerCloseButton">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="./app.js"></script>
</body>
</html>
